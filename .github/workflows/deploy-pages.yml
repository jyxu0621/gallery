name: Build and deploy gallery

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild all photo metadata and thumbnails
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore generated photo data
        uses: actions/cache@v4
        with:
          path: |
            apps/web/public/thumbnails
            apps/web/src/data/photos-manifest.json
          key: afilmory-${{ github.run_id }}
          restore-keys: |
            afilmory-
      - name: Generate manifest and thumbnails
        shell: bash
        run: |
          if [[ "${{ inputs.force_rebuild }}" == "true" ]]; then
            pnpm build:manifest --force
          else
            pnpm build:manifest
          fi
      - run: node scripts/audit-photo-privacy.mjs
      - run: pnpm exec tsx --test apps/web/base-path.test.ts
      - run: pnpm --filter @afilmory/builder type-check
      - run: pnpm --filter @afilmory/web build
      - run: pnpm --filter @afilmory/web type-check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
